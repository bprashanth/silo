<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helpline Service</title>
<style>
  :root { --bg: #ffffff; --ink: #1f2420; --muted: #5d665f; --line: #dddddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161816; --ink: #e9ece7; --muted: #a2aba3; --line: #333833; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  .container { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 28px; font-size: 26px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card { display: block; padding: 20px; border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--muted); }
  .card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>Helpline service</h1>
  <div class="grid">
    <a class="card" id="assist" href="#">
      <h2>Call center assist</h2>
      <p>Take the call; the agent fills the care record.</p>
    </a>
    <a class="card" href="https://t.me/Buffalosoldiers_bot" target="_blank" rel="noopener">
      <h2>Full call center</h2>
      <p>Buffalo Soldiers on Telegram.</p>
    </a>
  </div>
</div>
<script>
  // Same host as this page, so the link works on localhost and over the tailnet.
  document.getElementById('assist').href = `http://${location.hostname || '127.0.0.1'}:8776`;
</script>
</body>
</html>
